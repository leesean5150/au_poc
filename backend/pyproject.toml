[project]
name = "au-poc-backend"
version = "0.1.0"
description = "CRM / dashboard POC backend (FastAPI + Postgres)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
